name: Deploy GameMiKle to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "public/**"
      - "staticwebapp.config.json"
      - ".github/workflows/deploy-azure-static-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamemikle-static-web-app-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable this repository variable only after creating the Azure app and adding its token as a secret.
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    name: Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
